[project]
name = "ai-devcoach"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "openai>=1.68,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "python -m compileall -q backend"

[tool.ruff]
target-version = "py312"
line-length = 88
required-version = "==0.17.5"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
target-version = ["py312"]
line-length = 88
required-version = "26.10.1"
